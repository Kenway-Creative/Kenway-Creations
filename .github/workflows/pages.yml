name: Deploy Astro demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Inspect official venue photo accessibility
        run: |
          mkdir -p /tmp/horse-photo-probe
          for u in \
            'https://www.thehorseshepshed.co.uk/wp-content/uploads/2018/11/banner-01.jpg' \
            'https://www.thehorseshepshed.co.uk/wp-content/uploads/2018/11/banner-02.jpg' \
            'https://www.thehorseshepshed.co.uk/wp-content/uploads/2015/10/DSC_0420.png'; do
            base="$(basename "$u")"
            echo "Checking $base"
            curl -fLsS --connect-timeout 8 --max-time 18 -A 'Mozilla/5.0' "$u" -o "/tmp/horse-photo-probe/$base" || true
            if [ -f "/tmp/horse-photo-probe/$base" ]; then
              file "/tmp/horse-photo-probe/$base"
              du -h "/tmp/horse-photo-probe/$base"
            fi
          done
          curl -LsS --connect-timeout 8 --max-time 18 -A 'Mozilla/5.0' 'https://www.thehorseshepshed.co.uk/' -o /tmp/horse-photo-probe/home.html || true
          if [ -f /tmp/horse-photo-probe/home.html ]; then
            wc -c /tmp/horse-photo-probe/home.html
            grep -oE 'https?[^" ]+\\.(jpg|jpeg|png|webp)' /tmp/horse-photo-probe/home.html | head -25 || true
          fi
      - name: Discover official image sources
        run: |
          python - <<'PY'
          import re,html
          from urllib.request import urlopen, Request
          urls=['https://www.thehorseshepshed.co.uk/','https://www.thehorseshepshed.co.uk/about-us/','https://www.thehorseshepshed.co.uk/the-barn-courtyard/']
          for url in urls:
              print('PAGE',url)
              try:
                  page=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15).read().decode('utf-8','ignore')
                  found=re.findall(r'[^"\\s<>]+\\.(?:jpg|jpeg|png|webp)',html.unescape(page),flags=re.I)
                  unique=list(dict.fromkeys(found))
                  for value in unique[:55]: print('IMG',value[:200])
              except Exception as e: print('ERROR',str(e)[:180])
          import json
          for page_n in range(1,5):
              url=f'https://www.thehorseshepshed.co.uk/wp-json/wp/v2/media?per_page=100&media_type=image&page={page_n}'
              try:
                  x=json.load(urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15))
                  if isinstance(x,list):
                      print('MEDIA PAGE',page_n,'COUNT',len(x))
                      for o in x:
                          url=o.get('source_url','')
                          dims=o.get('media_details',{})
                          title=o.get('title',{}).get('rendered','') if isinstance(o.get('title'),dict) else ''
                          print('IMAGE_REF',o.get('id'),dims.get('width'),dims.get('height'),title[:35],url)
                      if len(x)<100: break
                  else: print('API not list')
              except Exception as e:
                  print('WP API',str(e)[:180]);break
          PY
      - name: Gather venue photographs for visual review
        run: |
          set +e
          mkdir -p /tmp/horse-asset-review
          for name in banner-01.jpg banner-02.jpg banner-03.jpg banner-04.jpg banner-05.jpg banner-06.jpg Homepage-Slider.jpg The-Barn.jpg; do
            curl -fLsS --connect-timeout 8 --max-time 20 "https://www.thehorseshepshed.co.uk/wp-content/uploads/2018/11/$name" -o "/tmp/horse-asset-review/$name"
          done
          for name in barn.png barn-1.png barn-2.png; do
            curl -fLsS --connect-timeout 8 --max-time 20 "https://www.thehorseshepshed.co.uk/wp-content/uploads/2018/05/$name" -o "/tmp/horse-asset-review/$name"
          done
          curl -fLsS --connect-timeout 8 --max-time 20 'https://www.thehorseshepshed.co.uk/wp-content/uploads/2015/10/DSC_0420.png' -o /tmp/horse-asset-review/DSC_0420.png
          file /tmp/horse-asset-review/* || true
      - name: Upload reference photography for review
        uses: actions/upload-artifact@v4
        with:
          name: venue-image-review
          path: /tmp/horse-asset-review
          retention-days: 1
      - name: Build for Pages
        env:
          DEPLOY_GITHUB_PAGES: 'true'
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/book/index.html
          test -f dist/stay/index.html
          grep -q '/Kenway-Creations/book/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
