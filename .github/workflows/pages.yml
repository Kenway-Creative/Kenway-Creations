name: Deploy Astro demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Inspect official venue photo accessibility
        run: |
          mkdir -p /tmp/horse-photo-probe
          for u in \
            'https://www.thehorseshepshed.co.uk/wp-content/uploads/2018/11/banner-01.jpg' \
            'https://www.thehorseshepshed.co.uk/wp-content/uploads/2018/11/banner-02.jpg' \
            'https://www.thehorseshepshed.co.uk/wp-content/uploads/2015/10/DSC_0420.png'; do
            base="$(basename "$u")"
            echo "Checking $base"
            curl -fLsS --connect-timeout 8 --max-time 18 -A 'Mozilla/5.0' "$u" -o "/tmp/horse-photo-probe/$base" || true
            if [ -f "/tmp/horse-photo-probe/$base" ]; then
              file "/tmp/horse-photo-probe/$base"
              du -h "/tmp/horse-photo-probe/$base"
            fi
          done
          curl -LsS --connect-timeout 8 --max-time 18 -A 'Mozilla/5.0' 'https://www.thehorseshepshed.co.uk/' -o /tmp/horse-photo-probe/home.html || true
          if [ -f /tmp/horse-photo-probe/home.html ]; then
            wc -c /tmp/horse-photo-probe/home.html
            grep -oE 'https?[^" ]+\\.(jpg|jpeg|png|webp)' /tmp/horse-photo-probe/home.html | head -25 || true
          fi
      - name: Build for Pages
        env:
          DEPLOY_GITHUB_PAGES: 'true'
        run: npm run build
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/book/index.html
          test -f dist/stay/index.html
          grep -q '/Kenway-Creations/book/' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
